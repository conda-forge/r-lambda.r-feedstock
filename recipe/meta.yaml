{% set version = "1.2.6" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-lambda.r
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/lambda.r_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/lambda.r/lambda.r_{{ version }}.tar.gz
  sha256: 0ad5ca078d86597a5527f781f10a669dc925f6b63e759cc43e0bccee77e69059

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
  host:
    - r-base
    - r-formatr
  run:
    - r-base
    - r-formatr

test:
  commands:
    - $R -e "library('lambda.r')"           # [not win]
    - "\"%R%\" -e \"library('lambda.r')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=lambda.r
  license: LGPL-3.0-only
  summary: A language extension to efficiently write functional programs in R. Syntax extensions include multi-part function definitions, pattern matching, guard statements, built-in (optional) type safety.
  license_family: LGPL
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/LGPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
